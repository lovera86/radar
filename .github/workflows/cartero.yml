# Cada mañana laborable, después de la jornada de los agentes: envía desde tu Gmail las
# presentaciones listas (o te las manda a ti mientras dura el ensayo), hace los seguimientos,
# mira si alguna empresa ha respondido y te manda el resumen del día.
name: Cartero de RADAR

on:
  schedule:
    - cron: "45 7 * * 1-5"   # 07:45 UTC = 08:45 en invierno / 09:45 en verano (hora de España)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartero
  cancel-in-progress: false

jobs:
  repartir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enviar y revisar respuestas
        env:
          RADAR_CARTERO: ${{ secrets.RADAR_CARTERO }}
          ENVIO_EMAIL: ${{ secrets.ENVIO_EMAIL }}
          ENVIO_APP_PASSWORD: ${{ secrets.ENVIO_APP_PASSWORD }}
        run: python cartero.py
