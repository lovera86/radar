# Cada mañana: busca contratos adjudicados nuevos, actualiza los datos y publica la web.
name: Radar diario

on:
  schedule:
    - cron: "15 5 * * *"   # 05:15 UTC = 06:15 en invierno / 07:15 en verano (hora de España)
  workflow_dispatch:        # botón «Run workflow» para lanzarlo a mano
    inputs:
      dias:
        description: "Días hacia atrás (vacío = desde la última vez)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/radar.yml"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  actualizar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar contratos nuevos
        env:
          DIAS: ${{ inputs.dias }}
        run: python radar.py ${DIAS:+--dias "$DIAS"}
      - name: Buscar ofertas de empleo
        env:
          INFOJOBS_ID: ${{ secrets.INFOJOBS_ID }}
          INFOJOBS_SECRET: ${{ secrets.INFOJOBS_SECRET }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          ADZUNA_ID: ${{ secrets.ADZUNA_ID }}
          ADZUNA_KEY: ${{ secrets.ADZUNA_KEY }}
          ALERTAS_EMAIL: ${{ secrets.ALERTAS_EMAIL }}
          ALERTAS_APP_PASSWORD: ${{ secrets.ALERTAS_APP_PASSWORD }}
        run: python empleos.py
      - name: Buscar empleo público
        run: python publico.py
      - name: Preparar datos de la web
        run: python exportar.py
      - name: Señales de empresas (BORME)
        run: |
          pip install --quiet pypdf
          python empresas.py
      - name: Noticias de expansión y proyectos
        run: python noticias.py
      - name: Unificar oportunidades (modelo común)
        run: python unificar.py
      - name: Guardar cambios
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Radar: datos del $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin main
          git push
      - name: Resumen por correo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python resumen.py

  publicar:
    needs: actualizar
    if: always() && (needs.actualizar.result == 'success' || needs.actualizar.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
