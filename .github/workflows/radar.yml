# Cada mañana: busca contratos adjudicados nuevos, actualiza los datos y publica la web.
name: Radar diario

on:
  schedule:
    - cron: "15 5 * * *"   # 05:15 UTC = 06:15 en invierno / 07:15 en verano (hora de España)
  workflow_dispatch:        # botón «Run workflow» para lanzarlo a mano
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/radar.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  actualizar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar contratos nuevos
        run: python radar.py
      - name: Preparar datos de la web
        run: python exportar.py
      - name: Guardar cambios
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Radar: datos del $(date -u +%Y-%m-%d)"
          git push

  publicar:
    needs: actualizar
    if: always() && (needs.actualizar.result == 'success' || needs.actualizar.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
